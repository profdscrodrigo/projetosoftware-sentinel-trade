# SentinelTrade - configuracao (os valores padrao funcionam no computador local)
# Todos os valores podem ser trocados por variaveis de ambiente (ver .env.example).

spring.application.name=SentinelTrade
server.port=${APP_PORT:8080}

# Banco SQLite (arquivo criado automaticamente na primeira execucao)
spring.datasource.url=jdbc:sqlite:${DB_PATH:database/sentineltrade.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
sentinel.scripts-dir=database

# Sessao segura (RNF-01)
server.servlet.session.timeout=${SESSAO_MINUTOS_EXPIRACAO:15}m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# true em producao (HTTPS). Localmente fica false porque o site roda em http://localhost
server.servlet.session.cookie.secure=${COOKIE_SEGURO:false}

# Erros nunca mostram detalhes internos ao usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Limite de tamanho das requisicoes
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB

logging.level.root=INFO

# O login e feito pelo proprio sistema (senha BCrypt + MFA); desliga o usuario padrao do Spring
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
