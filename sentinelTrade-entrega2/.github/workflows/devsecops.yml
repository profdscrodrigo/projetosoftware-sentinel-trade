# =====================================================================
# Esteira DevSecOps do SentinelTrade
# Roda sozinha a cada push ou pull request. Se algum passo falhar, o
# GitHub mostra um X vermelho e o código não deve ser aprovado.
# =====================================================================
name: Esteira DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 1) O código compila e as regras críticas continuam funcionando?
  build-e-testes:
    name: 1. Compilar e rodar os testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e testar (mvn verify)
        run: mvn -B verify

  # 2) Alguma biblioteca tem vulnerabilidade conhecida? Há senha/chave no código?
  dependencias-e-segredos:
    name: 2. Dependências e segredos (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relatório completo (alto e crítico)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Bloquear se houver vulnerabilidade crítica ou segredo exposto
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # 3) O código tem padrões perigosos (SQL injection, XSS, etc.)?
  analise-de-codigo:
    name: 3. Análise de segurança do código (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Procurar falhas de segurança no código Java
        run: semgrep scan --config p/java --config p/owasp-top-ten --severity ERROR --error
